<mat-card class="page-card">

  <mat-card-header>
    <mat-card-title>Employee Attendance</mat-card-title>
    <mat-card-subtitle>Check In / Check Out</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>

    <form [formGroup]="form" class="attendance-form">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Select Employee</mat-label>

        <mat-select formControlName="employeeId">
          <mat-option *ngFor="let employee of employees"
                      [value]="employee.id">
            {{ employee.name }}
          </mat-option>
        </mat-select>

      </mat-form-field>

      <div class="actions">

        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="checkIn()"
          [disabled]="form.invalid">

          <mat-icon>login</mat-icon>
          Check In

        </button>

        <button
          mat-raised-button
          color="accent"
          type="button"
          (click)="checkOut()"
          [disabled]="form.invalid">

          <mat-icon>logout</mat-icon>
          Check Out

        </button>

      </div>

    </form>

    <div class="attendance-status" *ngIf="getSelectedAttendance() as attendance">

      <h3>Today's Attendance</h3>

      <table class="status-table">

        <tr>
          <td><strong>Employee</strong></td>
          <td>{{ attendance.name }}</td>
        </tr>

        <tr>
          <td><strong>Check In</strong></td>
          <td>{{ attendance.checkInTime || '-' }}</td>
        </tr>

        <tr>
          <td><strong>Check Out</strong></td>
          <td>{{ attendance.checkOutTime || '-' }}</td>
        </tr>

        <tr>
          <td><strong>Working Hours</strong></td>
          <td>{{ attendance.workingHours || '-' }}</td>
        </tr>

      </table>

    </div>

  </mat-card-content>

</mat-card>
