<h2 mat-dialog-title>Edit attendance</h2>

<mat-dialog-content>
  <p class="employee">{{ data.name }}</p>

  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Check in (Egypt)</mat-label>
      <input matInput type="datetime-local" formControlName="checkInTime" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Check out (Egypt)</mat-label>
      <input matInput type="datetime-local" formControlName="checkOutTime" />
    </mat-form-field>

    @if (errorMessage) {
      <div class="error">{{ errorMessage }}</div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
    Save
  </button>
</mat-dialog-actions>
