<div class="container">

  <mat-card>

    <mat-card-header>
      <mat-card-title>Create User</mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="save()">

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          <mat-error *ngIf="form.controls.username.hasError('required')">
            Username is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-error *ngIf="form.controls.password.hasError('required')">
            Password is required.
          </mat-error>
          <mat-error *ngIf="form.controls.password.hasError('minlength')">
            Password must be at least 6 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            @for (role of roles; track role) {
              <mat-option [value]="role">{{ role }}</mat-option>
            }
          </mat-select>
          <mat-error *ngIf="form.controls.role.hasError('required')">
            Role is required.
          </mat-error>
        </mat-form-field>

        @if (errorMessage) {
          <div class="error">{{ errorMessage }}</div>
        }

        <div class="actions">
          <button type="button" mat-stroked-button routerLink="/users">
            Cancel
          </button>
          <button type="submit" mat-raised-button color="primary" [disabled]="form.invalid">
            Create User
          </button>
        </div>

      </form>

    </mat-card-content>

  </mat-card>

</div>
