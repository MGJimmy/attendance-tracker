<div class="container">

  <div class="header">

    <h2>Users</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="add()">
      <mat-icon>add</mat-icon>
      Add User
    </button>

  </div>

  <mat-card>

    <table
      mat-table
      [dataSource]="users"
      class="mat-elevation-z2 w-100">

      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let user">
          {{ user.userName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">
          {{ roleLabel(user) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let user">
          <span class="status active" *ngIf="user.isActive">Active</span>
          <span class="status inactive" *ngIf="!user.isActive">Inactive</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button
            mat-icon-button
            color="primary"
            (click)="editPassword(user)">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            *ngIf="user.isActive"
            mat-icon-button
            color="warn"
            (click)="deactivate(user.id)">
            <mat-icon>block</mat-icon>
          </button>

          <button
            *ngIf="!user.isActive"
            mat-icon-button
            color="accent"
            (click)="activate(user.id)">
            <mat-icon>check_circle</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card>

</div>
