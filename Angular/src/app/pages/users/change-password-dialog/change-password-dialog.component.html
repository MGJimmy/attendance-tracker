<h2 mat-dialog-title>Change password</h2>

<mat-dialog-content>
  <p class="username">{{ data.userName }}</p>

  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
      <mat-error *ngIf="form.controls.newPassword.hasError('required')">
        Password is required.
      </mat-error>
      <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">
        Password must be at least 6 characters.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <mat-error *ngIf="form.controls.confirmPassword.hasError('required')">
        Confirm the password.
      </mat-error>
    </mat-form-field>

    @if (form.hasError('passwordsMismatch') && form.touched) {
      <div class="error">Passwords do not match.</div>
    }

    @if (errorMessage) {
      <div class="error">{{ errorMessage }}</div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
    Save
  </button>
</mat-dialog-actions>
