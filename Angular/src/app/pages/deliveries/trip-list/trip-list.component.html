<div class="container">

  <div class="header">

    <h2>Trips</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="add()">
      <mat-icon>add</mat-icon>
      Add Trip
    </button>

  </div>

  <mat-card class="filters">

    <form [formGroup]="form" class="filter-row">

      <mat-form-field appearance="outline">
        <mat-label>Courier</mat-label>
        <mat-select formControlName="courierId">
          <mat-option [value]="null">All</mat-option>
          @for (courier of couriers; track courier.id) {
            <mat-option [value]="courier.id">{{ courier.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput [matDatepicker]="fromPicker" formControlName="from" readonly>
        <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
        <mat-datepicker #fromPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput [matDatepicker]="toPicker" formControlName="to" readonly>
        <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
        <mat-datepicker #toPicker></mat-datepicker>
      </mat-form-field>

      <div class="filter-actions">
        <button mat-raised-button color="primary" type="button" (click)="search()">
          Search
        </button>
        <button mat-stroked-button type="button" (click)="clear()">
          Clear
        </button>
      </div>

    </form>

  </mat-card>

  <mat-card>

    <table
      mat-table
      [dataSource]="trips"
      class="mat-elevation-z2 w-100">

      <ng-container matColumnDef="courierName">
        <th mat-header-cell *matHeaderCellDef>Courier</th>
        <td mat-cell *matCellDef="let trip">
          <button class="name-link" type="button" (click)="viewCourier(trip.courierId)">
            {{ trip.courierName }}
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="destinationName">
        <th mat-header-cell *matHeaderCellDef>Destination</th>
        <td mat-cell *matCellDef="let trip">{{ trip.destinationName }}</td>
      </ng-container>

      <ng-container matColumnDef="cost">
        <th mat-header-cell *matHeaderCellDef>Cost</th>
        <td mat-cell *matCellDef="let trip">{{ trip.cost | number:'1.2-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="tripDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let trip">{{ trip.tripDate | egyptDate:dateFormat }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let trip">
          <button mat-icon-button color="primary" (click)="edit(trip.id)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card>

</div>
