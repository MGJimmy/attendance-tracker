<div class="container">

  <mat-card>

    <mat-card-header>
      <mat-card-title>
        {{ isEditMode ? 'Edit Destination' : 'Add Destination' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="save()">

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name">

          <mat-error *ngIf="form.controls.name.hasError('required')">
            Name is required.
          </mat-error>

          <mat-error *ngIf="form.controls.name.hasError('maxlength')">
            Maximum 100 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Cost</mat-label>
          <input matInput type="number" formControlName="cost">

          <mat-error *ngIf="form.controls.cost.hasError('required')">
            Cost is required.
          </mat-error>

          <mat-error *ngIf="form.controls.cost.hasError('min')">
            Cost cannot be negative.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Details</mat-label>
          <textarea matInput rows="3" formControlName="details"></textarea>

          <mat-error *ngIf="form.controls.details.hasError('maxlength')">
            Maximum 500 characters.
          </mat-error>
        </mat-form-field>

        @if (errorMessage) {
          <div class="error">{{ errorMessage }}</div>
        }

        <div class="actions">
          <button type="button" mat-stroked-button routerLink="/destinations">
            Cancel
          </button>
          <button type="submit" mat-raised-button color="primary" [disabled]="form.invalid">
            {{ isEditMode ? 'Update Destination' : 'Add Destination' }}
          </button>
        </div>

      </form>

    </mat-card-content>

  </mat-card>

</div>
