<div class="container">

  <mat-card>

    <mat-card-header>
      <mat-card-title>
        {{ isEditMode ? 'Edit Courier' : 'Add Courier' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="save()">

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name">

          <mat-error *ngIf="form.controls.name.hasError('required')">
            Name is required.
          </mat-error>

          <mat-error *ngIf="form.controls.name.hasError('maxlength')">
            Maximum 100 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Mobile number</mat-label>
          <input matInput formControlName="mobileNumber">

          <mat-error *ngIf="form.controls.mobileNumber.hasError('required')">
            Mobile number is required.
          </mat-error>

          <mat-error *ngIf="form.controls.mobileNumber.hasError('maxlength')">
            Maximum 30 characters.
          </mat-error>
        </mat-form-field>

        @if (errorMessage) {
          <div class="error">{{ errorMessage }}</div>
        }

        <div class="actions">
          <button type="button" mat-stroked-button routerLink="/couriers">
            Cancel
          </button>
          <button type="submit" mat-raised-button color="primary" [disabled]="form.invalid">
            {{ isEditMode ? 'Update Courier' : 'Add Courier' }}
          </button>
        </div>

      </form>

    </mat-card-content>

  </mat-card>

</div>
