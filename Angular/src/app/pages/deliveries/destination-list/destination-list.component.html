<div class="container">

  <div class="header">

    <h2>Destinations</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="add()">
      <mat-icon>add</mat-icon>
      Add Destination
    </button>

  </div>

  <mat-card>

    <table
      mat-table
      [dataSource]="destinations"
      class="mat-elevation-z2 w-100">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let destination">
          {{ destination.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="cost">
        <th mat-header-cell *matHeaderCellDef>Cost</th>
        <td mat-cell *matCellDef="let destination">
          {{ destination.cost | number:'1.2-2' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="details">
        <th mat-header-cell *matHeaderCellDef>Details</th>
        <td mat-cell *matCellDef="let destination">
          {{ destination.details }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let destination">
          <span class="status active" *ngIf="destination.isActive">Active</span>
          <span class="status inactive" *ngIf="!destination.isActive">Inactive</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let destination">

          <button mat-icon-button color="primary" (click)="edit(destination.id)">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            *ngIf="destination.isActive"
            mat-icon-button
            color="warn"
            (click)="deactivate(destination.id)">
            <mat-icon>block</mat-icon>
          </button>

          <button
            *ngIf="!destination.isActive"
            mat-icon-button
            color="accent"
            (click)="activate(destination.id)">
            <mat-icon>check_circle</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card>

</div>
